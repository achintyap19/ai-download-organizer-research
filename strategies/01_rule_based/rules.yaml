min_confidence_threshold: 0.45
generic_doc_extensions: [".pdf", ".docx", ".xlsx", ".pptx", ".txt", ".md"]

rules:
  - category: "Software_Installers"
    priority: 100
    extensions: [".exe", ".msi", ".msix", ".deb", ".dmg", ".iso", ".apk"]
    filename_regex: "(?i)(setup|installer|amd64|x64|win64|v\\d+\\.\\d+)"
    content_keywords: []
    tags: ["software", "installer"]

  - category: "Archives_Compressed"
    priority: 95
    extensions: [".zip", ".rar", ".7z", ".tar", ".gz", ".xz"]
    filename_regex: "(?i)(backup|archive|bundle|pack|installtool)"
    content_keywords: []
    tags: ["archive"]

  - category: "Finance_Invoices"
    priority: 90
    extensions: [".pdf", ".xlsx", ".csv"]
    filename_regex: "(?i)(invoice|receipt|bill|statement|account[-_ ]?summary|tax|gst|itr|salary|payslip|txn|challan)"
    content_keywords: ["invoice number", "total amount", "gstin", "billing address", "tax invoice", "payment receipt", "account statement", "challan", "treasury", "penalty", "motor vehicles", "transaction"]
    tags: ["finance", "records"]

  - category: "Academic_Study"
    priority: 85
    extensions: [".pdf", ".pptx", ".docx", ".ipynb", ".tex"]
    filename_regex: "(?i)(lecture|notes|syllabus|assignment|lab|exam|pyq|unit[-_ ]?\\d|module[-_ ]?\\d|cse|tutorial|ntcc|dsa|deco|bee|maths|algo)"
    content_keywords: ["university", "semester", "professor", "syllabus", "assignment", "theorem", "algorithm", "b.tech", "amity", "practical examination", "hamiltonian", "linear regression"]
    tags: ["academic", "study"]

  - category: "Career_Identity"
    priority: 85
    extensions: [".pdf", ".docx"]
    filename_regex: "(?i)(resume|cv|curriculum[_ -]?vitae|offer[_ -]?letter|aadhaar|pan[_ -]?card|passport|marksheet|certificate)"
    content_keywords: ["curriculum vitae", "work experience", "education", "skills", "certify that", "internship", "unique identification", "government of india", "aadhaar"]
    tags: ["personal", "career"]

  - category: "Code_Development"
    priority: 80
    extensions: [".py", ".js", ".ts", ".jsx", ".tsx", ".java", ".cpp", ".c", ".json", ".yaml", ".yml", ".sql", ".html", ".css"]
    filename_regex: "(?i)(schema|config|script|main|index|app|server)"
    content_keywords: ["import ", "function ", "class ", "def ", "const ", "select ", "#include"]
    tags: ["code", "dev"]

  - category: "Media_Screenshots"
    priority: 75
    extensions: [".png", ".jpg", ".jpeg", ".webp"]
    filename_regex: "(?i)^(screenshot|snip|capture|screen[_ -]?shot)"
    content_keywords: []
    tags: ["image", "screenshot"]

  - category: "Media_Photos_Graphics"
    priority: 70
    extensions: [".jpg", ".jpeg", ".png", ".gif", ".svg", ".webp", ".bmp", ".heic"]
    filename_regex: "(?i)^(img_|dsc_|pxl_|wa\\d+|photo|whatsapp image)"
    content_keywords: []
    tags: ["media", "image"]

  - category: "Media_Audio_Video"
    priority: 70
    extensions: [".mp4", ".mkv", ".avi", ".mov", ".webm", ".mp3", ".wav", ".flac", ".m4a"]
    filename_regex: "(?i)(recording|lecture_rec|video|audio|instruction)"
    content_keywords: []
    tags: ["media", "av"]

  - category: "Spreadsheets_Data"
    priority: 65
    extensions: [".xlsx", ".xls", ".csv", ".tsv", ".ods"]
    filename_regex: "(?i)(data|dataset|sheet|tracker|log|allocation|annotation)"
    content_keywords: ["annotation", "allocation", "dataset", "label"]
    tags: ["data", "spreadsheet"]